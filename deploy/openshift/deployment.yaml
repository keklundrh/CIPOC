apiVersion: apps/v1
kind: Deployment
metadata:
  name: cipoc-workbench
spec:
  replicas: 1
  triggers:
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
          - workbench
        from:
          kind: ImageStreamTag
          name: cipoc-workbench:latest
  selector:
    matchLabels: { app: cipoc-workbench }
  template:
    metadata:
      labels: { app: cipoc-workbench }
    spec:
      containers:
        - name: workbench
          image: image-registry.openshift-image-registry.svc:5000/cipoc-testing/cipoc-workbench:latest
          ports: [{ containerPort: 8000 }]
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /, port: 8000 }
            initialDelaySeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cipoc-workbench-data
