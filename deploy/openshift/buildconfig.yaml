apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: cipoc-workbench
spec: 
  source: 
    git:
      uri: https://github.com/keklundrh/CIPOC.git
      ref: dev
    contextDir: packages/cipoc-workbench
    sourceSecret:
      name: github-build-secret
  strategy:
    dockerStrategy: {}
  output: 
    to:
      kind: ImageStreamTag
      name: cipoc-workbench:latest
  triggers:
    - type: GitHub
      github:
        secretReference: 
          name: cipoc-workbench-webhook
    - type: ConfigChange
