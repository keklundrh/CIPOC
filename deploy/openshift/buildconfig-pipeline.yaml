# Pipeline image BuildConfig — builds the CIPOC orchestrator container.
#
# Builds from the REPO ROOT (no contextDir: "." — it is the default and this
# cluster normalizes it away). Dockerfile at the root is the dockerStrategy
# default path, so no dockerfilePath override is needed anywhere.
#
# No GitHub webhook trigger: the pipeline image changes rarely, and every-push
# rebuilds of a 1.5 GB image are wasteful. Trigger with:
#   oc start-build cipoc-pipeline
# The workbench keeps its own webhook (cipoc-workbench-webhook) — unaffected.

apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: cipoc-pipeline
spec:
  source:
    git:
      uri: https://github.com/keklundrh/CIPOC.git
      ref: dev
    sourceSecret:
      name: github-build-secret
    type: Git
  strategy:
    dockerStrategy: {}
  output:
    to:
      kind: ImageStreamTag
      name: cipoc-pipeline:latest
  triggers:
    - type: ConfigChange
